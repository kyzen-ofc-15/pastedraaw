<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Pastebin</title>
  <style>
    body { font-family: monospace; padding: 2rem; }
    textarea { width: 100%; height: 200px; margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    .link { margin-top: 1rem; display: block; }
  </style>
</head>
<body>
  <h1>Mini Pastebin</h1>
  <textarea id="content" placeholder="Tulis kode atau teks di sini..."></textarea><br/>
  <button onclick="createPaste()">Buat Paste</button>
  <a id="result" class="link"></a>

  <script>
    async function createPaste() {
      const text = document.getElementById("content").value;
      if (!text) return alert("Isi dulu teksnya!");

      const res = await fetch("/api/new", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text })
      });

      const data = await res.json();
      if (data.id) {
        const url = window.location.origin + "/" + data.id;
        document.getElementById("result").href = url;
        document.getElementById("result").textContent = "Paste Link: " + url;
      }
    }
  </script>
</body>
</html>
